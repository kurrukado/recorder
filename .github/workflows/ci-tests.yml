name: Automated Bug & Regression Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Tự động rà soát bug định kỳ 4 lần/ngày (0h, 6h, 12h, 18h UTC)
    - cron: '0 0,6,12,18 * * *'

concurrency:
  group: ci-bug-check-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Run Linter & 104 Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Packages (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: 1. Kiểm tra Cú pháp & Biến chưa khai báo (Flake8 Linter)
        id: linter
        run: |
          echo "=========================================="
          echo "🔍 ĐANG QUÉT TĨNH CODE VÀ BIẾN CHƯA KHAI BÁO..."
          echo "=========================================="
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics > linter_report.txt 2>&1 || true
          cat linter_report.txt
          ERR_COUNT=$(tail -n 1 linter_report.txt | tr -dc '0-9')
          if [ -n "$ERR_COUNT" ] && [ "$ERR_COUNT" -gt 0 ]; then
            echo "LINTER_FAILED=true" >> $GITHUB_ENV
            echo "::error::Phát hiện $ERR_COUNT lỗi cú pháp / undefined variables trong code!"
            exit 1
          else
            echo "LINTER_FAILED=false" >> $GITHUB_ENV
          fi

      - name: 2. Chạy Bộ Kiểm Thử Lõi (78 Audit Tests)
        id: unit_tests
        run: |
          echo "=========================================="
          echo "🧪 ĐANG CHẠY 78 BÀI TEST AUDIT & REGRESSION..."
          echo "=========================================="
          python -m unittest test_audit_suite.py -v > test_report.txt 2>&1 || true
          cat test_report.txt
          if grep -q "FAILED" test_report.txt; then
            echo "TESTS_FAILED=true" >> $GITHUB_ENV
            echo "::error::Phát hiện bài test bị thất bại!"
            exit 1
          else
            echo "TESTS_FAILED=false" >> $GITHUB_ENV
          fi

      - name: 3. Kiểm tra Smoke Test Cloud API
        if: always()
        run: |
          python -c "
          import urllib.request, json
          try:
              url = 'https://tiktok-api-i0o8.onrender.com/api/health'
              req = urllib.request.Request(url, headers={'User-Agent': 'Kuru-CI-Watcher/1.0'})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read().decode('utf-8'))
                  print(f'[✓] Cloud Render API Health: OK ({data.get(\"status\")})')
          except Exception as e:
              print(f'[-] Render API health warning (có thể đang sleep): {e}')
          "
