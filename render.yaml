services:
  - type: web
    name: recorder-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RECORD_CONTROL_ONLY
        value: '1'
      # Tuỳ chọn nhưng nên đặt: service free có URL công khai. Chưa đặt thì API
      # điều khiển chạy không mật khẩu (vẫn chặn ghi hình/media).
      - key: RECORD_PIN
        sync: false
